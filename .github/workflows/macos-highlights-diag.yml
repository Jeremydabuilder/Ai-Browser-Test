name: macOS diagnostic - highlights-integration crash

# TEMPORARY: chasing a native crash observed once in a full-suite CI run
# in tests/test_highlights_integration.py (setUp's pump() right after
# constructing a real MainWindow/QWebEngineView), preceded by Chromium
# messages ("bootstrap_look_up ... MachPortRendezvousServer ... No
# rendezvous client, terminating process (parent died?)") suggesting a
# QtWebEngine helper subprocess failed its own startup handshake. This is
# investigated SEPARATELY from the GuiBridge/verify-dialog crash in
# windows-diag.yml / macos-diag.yml - do not assume they're related until
# evidence says so. Manual trigger only, entirely separate from
# release.yml. Delete this file once the crash is root-caused.

on:
  workflow_dispatch:
    inputs:
      attempts:
        description: "How many times to run the whole file in a row"
        type: number
        default: 20

jobs:
  macos-highlights-diag:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Confirm lldb is available
        run: lldb --version

      - name: Run the whole file repeatedly under lldb
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          set +e
          ATTEMPTS="${{ inputs.attempts }}"

          # lldb's batch "run" stops at the process's own initial exec
          # event (dyld startup, before any Python code runs) - confirmed
          # separately in macos-mcp-sequence-diag.yml's run 35169289870,
          # where a "crash" reproduced in 2.6s with a backtrace of nothing
          # but `dyld\`_dyld_start`. Without a "continue" past that first
          # benign stop, "run" never lets the debuggee actually execute,
          # so this loop was never actually running the test file at all.
          # The extra continues are harmless once the process is already
          # running or has exited - lldb just reports "no process".
          #
          # Also, `lldb --batch ... -o "quit"` exits 0 whenever the
          # debugger session itself completes cleanly, REGARDLESS of
          # whether the debuggee crashed - so the exit code was never a
          # valid signal either. Same principle as the sequence-diag
          # scripts' is_real_crash(): only a log with no clean "Ran N
          # tests"/"OK"-or-"FAILED (...)" summary means the interpreter
          # actually died before unittest could report.
          is_real_crash() {
            local log="$1"
            if grep -qE '^Ran [0-9]+ tests? in' "$log" \
                && grep -qE '^(OK|FAILED \()' "$log"; then
              return 1
            fi
            return 0
          }

          CRASHED_ATTEMPT=""
          for i in $(seq 1 "$ATTEMPTS"); do
            echo "::group::attempt $i"
            lldb --batch \
              -o "run" -o "continue" -o "continue" -o "continue" \
              -o "thread backtrace all" -o "quit" -- \
              python3 -m unittest tests.test_highlights_integration -v \
              > "/tmp/highlights_attempt_$i.log" 2>&1
            status=$?
            if is_real_crash "/tmp/highlights_attempt_$i.log"; then
              echo "exit=$status realCrash=true"
              echo "::endgroup::"
              echo "::error::Attempt $i crashed - full log follows"
              cat "/tmp/highlights_attempt_$i.log"
              CRASHED_ATTEMPT="$i"
              break
            fi
            echo "exit=$status realCrash=false"
            echo "::endgroup::"
          done
          echo "Ran ${CRASHED_ATTEMPT:-$ATTEMPTS} attempt(s) before stopping."

      - name: Upload all attempt logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-highlights-diag-logs
          path: /tmp/highlights_attempt_*.log
          if-no-files-found: warn
