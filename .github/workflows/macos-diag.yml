name: macOS diagnostic - intermittent verify-dialog crash

# TEMPORARY: chasing an intermittent (roughly 1-in-3) native SIGSEGV on real
# macOS CI hardware in test_mcp_client_setup_ui.ClientSetupDialogTests.
# test_verifying_a_real_pairing_reaches_verified, never reproduced on Linux
# locally. Manual trigger only, entirely separate from release.yml so this
# never affects the real release pipeline. Delete this file once the crash
# is root-caused and fixed (or definitively shown to be a test-harness-only
# artifact with no production impact).
#
# Runs the single failing test many times in a row under lldb's batch mode
# so a crash - if it happens during this run - captures a native
# all-threads backtrace, plus PYBROWSER_VERIFY_DIAG=1's own lifecycle trace
# (QObject/QThread creation, thread affinity, signal emit/deliver,
# deleteLater, socket/server shutdown - see app/ui/mcp_server_settings.py
# and app/mcp_server/server.py's _diag()) and PYTHONFAULTHANDLER=1's
# per-thread Python stack dump on any fatal signal.

on:
  workflow_dispatch:
    inputs:
      attempts:
        description: "How many times to run the test in a row"
        type: number
        default: 50

jobs:
  macos-diag:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Confirm lldb is available
        run: lldb --version

      - name: Run the failing test repeatedly under lldb
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
          PYBROWSER_VERIFY_DIAG: "1"
        run: |
          set +e
          ATTEMPTS="${{ inputs.attempts }}"

          # lldb's batch "run" stops at the process's own initial exec
          # event (dyld startup, before any Python code runs) - confirmed
          # in macos-mcp-sequence-diag.yml's run 35169289870, where a
          # "crash" reproduced in 2.6s with a backtrace of nothing but
          # `dyld\`_dyld_start`. Without a "continue" past that first
          # benign stop, this loop never actually ran the test at all in
          # any of its previous invocations - the earlier "50/50 clean"
          # result from this file is therefore unvalidated, not confirmed
          # clean, and needs to be re-run with this fix before being
          # trusted. The extra continues are harmless no-ops once the
          # process is already running or has exited.
          #
          # Also, `lldb --batch ... -o "quit"` exits 0 whenever the
          # debugger session itself completes cleanly, regardless of
          # whether the debuggee crashed - so exit code alone was never a
          # valid crash signal either. Only a log with no clean "Ran N
          # tests"/"OK"-or-"FAILED (...)" summary means the interpreter
          # actually died before unittest could report.
          is_real_crash() {
            local log="$1"
            if grep -qE '^Ran [0-9]+ tests? in' "$log" \
                && grep -qE '^(OK|FAILED \()' "$log"; then
              return 1
            fi
            return 0
          }

          CRASHED_ATTEMPT=""
          for i in $(seq 1 "$ATTEMPTS"); do
            echo "::group::attempt $i"
            lldb --batch \
              -o "run" -o "continue" -o "continue" -o "continue" \
              -o "thread backtrace all" -o "quit" -- \
              python3 -m unittest \
              tests.test_mcp_client_setup_ui.ClientSetupDialogTests.test_verifying_a_real_pairing_reaches_verified \
              -v > "/tmp/attempt_$i.log" 2>&1
            status=$?
            if is_real_crash "/tmp/attempt_$i.log"; then
              echo "exit=$status realCrash=true"
              echo "::endgroup::"
              echo "::error::Attempt $i crashed - full log follows"
              cat "/tmp/attempt_$i.log"
              CRASHED_ATTEMPT="$i"
              break
            fi
            echo "exit=$status realCrash=false"
            echo "::endgroup::"
          done
          echo "Ran ${CRASHED_ATTEMPT:-$ATTEMPTS} attempt(s) before stopping."

      - name: Upload all attempt logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-diag-logs
          path: /tmp/attempt_*.log
          if-no-files-found: warn
