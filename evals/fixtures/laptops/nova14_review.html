<!doctype html><html lang='en'><head><meta charset='utf-8'><title>Nova 14 review - Bench Notes</title></head><body><main><h1>Nova 14 review - Bench Notes</h1>
<p>We measured the Nova 14 at 7 hours 40 minutes of mixed browsing and video, well short of the 12 hours the maker claims. The price at review time was $749.</p>
<p>Build quality is good for the price. The fan is audible under load. Weight on our scale: 1.31 kg.</p></main></body></html>
