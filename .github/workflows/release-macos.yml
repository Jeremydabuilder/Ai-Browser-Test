name: Release build - macOS

# Builds, never publishes - see release-windows.yml's header for the same
# reasoning. Runs on the real macOS runner GitHub provides, since a macOS
# binary cannot be produced anywhere else.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0" "pyinstaller-hooks-contrib>=2024.0"

      - name: Run the test suite
        # unittest, not pytest - see release-windows.yml's comment on the
        # same step: this matches the project's own documented test command
        # instead of adding an undeclared dependency.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Read the app version
        id: version
        run: echo "version=$(python3 -c 'from app import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build the .icns app icon
        run: bash packaging/macos/make_icns.sh

      - name: Build with PyInstaller
        run: pyinstaller packaging/macos/pybrowser.spec --noconfirm

      - name: Ad-hoc sign for local testing
        # NOT a real signature - satisfies nothing but this runner's own
        # Gatekeeper check well enough to smoke-test the .app. Real
        # distribution needs a Developer ID + notarization; see
        # packaging/SIGNING.md. Never treat this step as "it's signed."
        run: codesign --force --deep --sign - dist/PyBrowser.app

      - name: Smoke test - launch the app bundle
        # Same honest limitation as the Windows workflow: this proves the
        # frozen .app actually starts on a real Mac and survives past
        # whatever would crash it immediately, not that a person clicked
        # through the UI. See packaging/macos/README.md for the real
        # first-run checklist.
        #
        # `open dist/PyBrowser.app` (used here originally) hands the launch
        # off to Launch Services, which starts the app as a *detached*
        # process - it does not inherit this shell's exported env vars, and
        # there is no way to capture its stdout/stderr. That made an earlier
        # real CI failure undiagnosable: the app exited within 15s and the
        # smoke test could not show why. Launching the bootloader binary
        # directly keeps it a normal child process, so PYBROWSER_DATA_DIR
        # actually reaches it and a crash's stdout/stderr is captured.
        run: |
          export PYBROWSER_DATA_DIR="$RUNNER_TEMP/pybrowser-smoke"
          OUT="$RUNNER_TEMP/pybrowser-smoke-stdout.log"
          "dist/PyBrowser.app/Contents/MacOS/PyBrowser" > "$OUT" 2>&1 &
          APP_PID=$!
          sleep 15
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "PyBrowser.app ran for 15s without exiting."
            kill "$APP_PID"
          else
            wait "$APP_PID" && STATUS=0 || STATUS=$?
            echo "PyBrowser.app exited early (status $STATUS) - this is a real release bug, not a flaky test."
            echo "--- stdout/stderr ---"
            cat "$OUT" || true
            LOG="$PYBROWSER_DATA_DIR/logs/pybrowser.log"
            echo "--- $LOG ---"
            if [ -f "$LOG" ]; then cat "$LOG"; else echo "(no log file was written at $LOG)"; fi
            exit 1
          fi

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build the .dmg
        run: |
          mkdir -p packaging/macos/output
          create-dmg \
            --volname "PyBrowser" \
            --window-size 540 380 \
            --icon-size 96 \
            --icon "PyBrowser.app" 140 160 \
            --app-drop-link 400 160 \
            "packaging/macos/output/PyBrowser-macOS-${{ steps.version.outputs.version }}.dmg" \
            "dist/PyBrowser.app"

      - uses: actions/upload-artifact@v4
        with:
          name: PyBrowser-macOS-${{ steps.version.outputs.version }}
          path: packaging/macos/output/*.dmg
          if-no-files-found: error

# Notarization: intentionally not wired up. It needs a paid Apple Developer
# ID, an app-specific password or API key, and `xcrun notarytool` /
# `stapler` - none of which belong here even as placeholders. See
# packaging/SIGNING.md for exactly what those steps would look like once
# real credentials exist.
